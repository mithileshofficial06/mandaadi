<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mandaadi</title>
    <link rel="preload" href="/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Barlow Condensed'; src: url('/fonts/barlow-condensed-latin-700-normal.woff2') format('woff2'); font-weight: 700; font-display: block; }
      html, body { margin: 0; height: 100%; background: #0b3f5c; overflow: hidden; }
      #boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; align-content: center; gap: 18px;
        background: radial-gradient(120% 80% at 50% 30%, #1d8aa0 0%, #0f6a82 35%, #0b3f5c 100%);
        color: #f4f1ea; font-family: 'Barlow Condensed', system-ui, sans-serif; transition: opacity 0.4s ease, visibility 0.4s; }
      #boot.is-done { opacity: 0; visibility: hidden; }
      .bl__mark { width: 132px; height: 70px; }
      .bl__mark path { fill: none; stroke: #ff6b1a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 260; stroke-dashoffset: 260; animation: bl-draw 1.6s cubic-bezier(.6,.1,.3,1) 0.1s forwards; }
      .bl__brand { margin: 0; font-size: 46px; font-weight: 700; letter-spacing: 0.32em; padding-left: 0.32em; }
      .bl__tag { margin: -8px 0 0; font: 400 15px/1.3 system-ui, sans-serif; letter-spacing: 0.08em; color: #cfe6ea; }
      .bl__meter { width: 180px; height: 3px; border-radius: 3px; background: rgba(244, 241, 234, 0.18); overflow: hidden; margin-top: 10px; }
      .bl__fill { width: 0; height: 100%; background: #f4f1ea; transition: width 0.3s ease; }
      @keyframes bl-draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .bl__mark path { animation: none; stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Mandaadi">
      <svg class="bl__mark" viewBox="0 0 132 70" aria-hidden="true">
        <path d="M6 62 C 30 60, 44 46, 52 30 C 58 18, 62 10, 66 8 C 70 10, 74 18, 80 30 C 88 46, 102 58, 126 60" />
      </svg>
      <h1 class="bl__brand">MANDAADI</h1>
      <p class="bl__tag">Same wind. Your line.</p>
      <div class="bl__meter"><div class="bl__fill"></div></div>
    </div>
    <script src="/boot.js"></script>
    <canvas id="sea" aria-label="The race course"></canvas>
    <div id="app"></div>
    <script type="module" src="race/main.tsx"></script>
  </body>
</html>
